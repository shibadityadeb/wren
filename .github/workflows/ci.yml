name: CI

on:
  push:
    branches: ['**']   # main and feature branches: every push gets a downloadable preview DMG
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 16.4 if available
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then sudo xcode-select -s /Applications/Xcode_16.4.app; fi
          xcodebuild -version; swift --version; uname -m
      - name: Full test suite (native ${{ matrix.arch }})
        run: swift test
      - name: Native release build and smoke test
        run: |
          swift build -c release --product Wren
          .build/release/Wren --smoke-test | tee /dev/stderr | grep -q "arch=${{ matrix.arch }}"

  package:
    name: Universal DMG (unsigned preview)
    needs: test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # build number = commit count
      - name: Select Xcode 16.4 if available
        run: if [ -d /Applications/Xcode_16.4.app ]; then sudo xcode-select -s /Applications/Xcode_16.4.app; fi
      - name: Build, package and verify
        run: scripts/package-dmg.sh --skip-tests
      - name: Summarise artifact
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          MNT=$(mktemp -d); hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG" >/dev/null
          P="$MNT/Wren.app/Contents/Info.plist"
          {
            echo "### Preview installer"
            echo "| | |"; echo "|---|---|"
            echo "| File | \`$(basename "$DMG")\` |"
            echo "| Version | $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$P") (build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$P")) |"
            echo "| Architectures | $(lipo -archs "$MNT/Wren.app/Contents/MacOS/Wren") |"
            echo "| Minimum macOS | $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$P") |"
            echo "| Signing | $(codesign -dv "$MNT/Wren.app" 2>&1 | grep -q 'Developer ID' && echo 'Developer ID' || echo 'Unsigned (ad-hoc) preview: not notarized') |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 "$DMG.sha256")\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          hdiutil detach "$MNT" -quiet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Wren-preview-unsigned-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.sha256
          retention-days: 14
          if-no-files-found: error

  verify-intel:
    name: Verify DMG on Intel
    needs: package
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Wren-preview-unsigned-${{ github.sha }}
          path: dist
      - name: Verify (runs the x86_64 slice natively)
        run: scripts/verify-dmg.sh dist/Wren-macOS-universal-unsigned.dmg
