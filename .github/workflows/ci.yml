name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 16.4 if available
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then sudo xcode-select -s /Applications/Xcode_16.4.app; fi
          xcodebuild -version; swift --version; uname -m
      - name: Full test suite (native ${{ matrix.arch }})
        run: swift test
      - name: Native release build and smoke test
        run: |
          swift build -c release --product Wren
          .build/release/Wren --smoke-test | tee /dev/stderr | grep -q "arch=${{ matrix.arch }}"

  package:
    name: Universal DMG (unsigned preview)
    needs: test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # build number = commit count
      - name: Select Xcode 16.4 if available
        run: if [ -d /Applications/Xcode_16.4.app ]; then sudo xcode-select -s /Applications/Xcode_16.4.app; fi
      - name: Build, package and verify
        run: scripts/package-dmg.sh --skip-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Wren-preview-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.sha256
          retention-days: 14
          if-no-files-found: error

  verify-intel:
    name: Verify DMG on Intel
    needs: package
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Wren-preview-${{ github.sha }}
          path: dist
      - name: Verify (runs the x86_64 slice natively)
        run: scripts/verify-dmg.sh dist/Wren-macOS-universal-unsigned.dmg
